<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Task - jsPsych</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            background-color: #FFFFFF;
            color: #333;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 刺激の文字サイズ設定 */
        .stroop-stimulus {
            font-size: 60px;
            font-weight: bold;
            user-select: none;
            margin-bottom: 50px;
        }

        /* 操作ガイド */
        .key-guide {
            position: absolute;
            bottom: 20%;
            font-size: 18px;
            color: #888;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 8px;
        }

        /* 教示の文字サイズ設定 */
        .instruction-text {
            font-size: 24px;
            line-height: 1.8;
            text-align: center;
            max-width: 800px;
            user-select: none;
        }

        .fixation {
            font-size: 60px;
            user-select: none;
        }

        kbd {
            background-color: #eee;
            border-radius: 3px;
            border: 1px solid #b4b4b4;
            padding: 2px 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <script>
        const jsPsych = initJsPsych({
            on_finish: function() {
                jsPsych.data.displayData('csv');
            }
        });

        // 画面をクリックした時にフォーカスを当てる（念のため）
        window.addEventListener('click', () => {
            window.focus();
        });

        const timeline = [];

        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction-text">
                    <p>文字の意味ではなく、<strong>「文字の色」</strong>を答えてください。</p>
                    <div style="margin: 30px 0; border: 2px solid #eee; padding: 20px; border-radius: 10px; background-color: #fafafa;">
                        <span style="color: red; font-weight: bold;">赤</span>色なら <kbd>r</kbd><br>
                        <span style="color: blue; font-weight: bold;">青</span>色なら <kbd>b</kbd><br>
                        <span style="color: green; font-weight: bold;">緑</span>色なら <kbd>g</kbd>
                    </div>
                    <p style="color: #d9534f; font-weight: bold;">【重要】半角英数モード（直接入力）にしてください</p>
                    <p>準備ができたら、<strong>スペースキー</strong>を押して開始してください。</p>
                </div>
            `,
            choices: [' '] 
        };
        timeline.push(instructions);

        const words = ["赤", "青", "緑"];
        const colors = ["red", "blue", "green"];
        const color_keys = { "red": "r", "blue": "b", "green": "g" };

        let stimuli_list = [];
        for (let w of words) {
            for (let c of colors) {
                let condition = (w === (c === "red" ? "赤" : c === "blue" ? "青" : "緑")) ? "congruent" : "incongruent";
                stimuli_list.push({
                    word: w,
                    color: c,
                    condition: condition,
                    correct_response: color_keys[c]
                });
            }
        }

        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="fixation">+</div>',
            choices: "NO_KEYS",
            trial_duration: 500,
            data: { task: 'fixation' }
        };

        const stroop_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                const word = jsPsych.timelineVariable('word');
                const color = jsPsych.timelineVariable('color');
                return `
                    <div class="stroop-stimulus" style="color: ${color};">${word}</div>
                    <div class="key-guide">赤:<kbd>r</kbd> / 青:<kbd>b</kbd> / 緑:<kbd>g</kbd></div>
                `;
            },
            choices: ['r', 'b', 'g'],
            data: {
                task: 'response',
                word: jsPsych.timelineVariable('word'),
                color: jsPsych.timelineVariable('color'),
                condition: jsPsych.timelineVariable('condition'),
                correct_response: jsPsych.timelineVariable('correct_response')
            },
            on_load: function() {
                // 刺激提示時に強制的にウィンドウにフォーカスを戻す
                window.focus();
            },
            on_finish: function(data) {
                data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
            }
        };

        const iti = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '',
            choices: "NO_KEYS",
            trial_duration: 1000,
            data: { task: 'iti' }
        };

        const main_procedure = {
            timeline: [fixation, stroop_trial, iti],
            timeline_variables: stimuli_list,
            sample: {
                type: 'with-replacement',
                size: 10
            }
        };
        timeline.push(main_procedure);

        jsPsych.run(timeline);
    </script>
</body>
</html>
