<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychology Lab</title>
    <style>
        /* Base reset and layout */
        :root {
            --bg-color: #f5f7fa;
            --container-bg: #ffffff;
            --primary-blue: #0066ff;
            --primary-hover: #0052cc;
            --text-main: #2d3436;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Centered main container */
        .container {
            text-align: center;
            padding: 3rem 2rem;
            background-color: var(--container-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            max-width: 90%;
            width: 440px;
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2.5rem;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        /* Experiment trigger button */
        .start-button {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 1.25rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
            width: 100%;
            outline: none;
        }

        .start-button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.35);
        }

        .start-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 102, 255, 0.25);
        }

        /* Custom Alert Dialog */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: block;
            opacity: 1;
        }

        .modal-content {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%);
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            z-index: 1000;
            text-align: center;
            width: 320px;
            transition: transform 0.3s ease;
        }

        .modal-content.active {
            display: block;
            transform: translate(-50%, -50%);
        }

        .modal-text {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .close-btn {
            background: #edf2f7;
            color: #4a5568;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            width: 100%;
        }

        .close-btn:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>心理学実験室へようこそ</h1>
        <button class="start-button" onclick="openModal()">
            実験を開始する
        </button>
    </main>

    <!-- Custom Modal Structure -->
    <div id="overlay" class="modal-overlay" onclick="closeModal()"></div>
    <div id="modal" class="modal-content">
        <p class="modal-text">Hello World!</p>
        <button class="close-btn" onclick="closeModal()">閉じる</button>
    </div>

    <script>
        /**
         * Opens the custom modal with animation
         */
        function openModal() {
            const overlay = document.getElementById('overlay');
            const modal = document.getElementById('modal');
            
            overlay.classList.add('active');
            modal.classList.add('active');
            
            // Focus on close button for accessibility
            setTimeout(() => {
                modal.querySelector('.close-btn').focus();
            }, 100);
        }

        /**
         * Closes the custom modal
         */
        function closeModal() {
            const overlay = document.getElementById('overlay');
            const modal = document.getElementById('modal');
            
            overlay.classList.remove('active');
            modal.classList.remove('active');
        }

        // Close on Escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
