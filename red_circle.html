<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>jsPsych Red Circle Task</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        /* 背景色をグレーに設定し、jsPsychのコンテナを画面いっぱいに広げる */
        body {
            background-color: #808080;
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロールバーを隠す */
        }

        /* jsPsychのメインコンテナもグレーにする */
        .jspsych-display-element {
            background-color: #808080;
            color: white; /* テキストが見えるように白に設定 */
        }

        /* 赤い円の定義 */
        .red-circle {
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 50%;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
    <script>
        /**
         * jsPsychの初期化
         */
        const jsPsych = initJsPsych({
            on_finish: function() {
                jsPsych.data.displayData();
            }
        });

        const timeline = [];

        // 1. インストラクション
        const instruction = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div style="font-family: sans-serif;">
                    <p>画面中央に赤い円が表示されます。</p>
                    <p>準備ができたら、<strong>何かキーを押して</strong>開始してください。</p>
                </div>
            `,
            choices: "ALL"
        };
        timeline.push(instruction);

        // 2. 赤い円を表示する試行
        const red_circle_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="red-circle"></div>',
            choices: "ALL",
            prompt: '<p style="margin-top: 20px;">キーを押すと終了します</p>',
            data: {
                task: 'red_circle_display'
            }
        };
        timeline.push(red_circle_trial);

        /**
         * 実行
         */
        jsPsych.run(timeline);
    </script>
</body>
</html>
